[project]
name = "campus-rag-backend"
version = "0.1.0"
description = "Backend for the Campus RAG Assistant (personal docs + university regulations)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "chromadb==0.5.5",
    "posthog<3.0",
    "httpx<0.28",
    "sentence-transformers==3.0.1",
    "groq==0.11.0",
    "pypdf==4.3.1",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "onnxruntime>=1.30.0",
]

[tool.uv]
# uv will download this interpreter automatically if it isn't already
# installed on your machine — no manual Python install needed.
python-preference = "managed"
